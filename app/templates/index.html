<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravix AI Chat</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L2 19.5h20L12 2zm0 4.5l6.5 11.5h-13L12 6.5z"/>
            </svg>
          </div>
        </div>
        <button class="icon-btn collapse-btn" id="collapseSidebarBtn" title="Collapse sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>

      <div class="sidebar-action">
        <button class="new-chat-btn" id="newChatBtn">
          New Chat
        </button>
      </div>

      <div class="sidebar-content">
        <div class="history-section">
          <div class="section-title">TODAY</div>
          <div class="chat-list" id="chatList">
            <!-- Dynamic chat sessions injected here -->
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="model-badge">
          <span class="status-indicator"></span>
          <span class="model-name" id="displayModelName">Gravix Intelligence</span>
        </div>
      </div>
    </aside>

    <!-- Mobile Header -->
    <header class="mobile-header" id="mobileHeader">
      <button class="icon-btn" id="openMobileSidebarBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="mobile-title">Gravix AI</div>
      <button class="icon-btn" id="mobileNewChatBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </header>

    <!-- Main Chat Canvas -->
    <main class="main-canvas">
      <!-- Ambient purple glow behind header -->
      <div class="ambient-glow"></div>

      <!-- Messages Stream Container -->
      <div class="messages-scroll-area" id="messagesContainer">
        <!-- Hero State when chat is empty -->
        <div class="hero-greeting" id="heroGreeting">
          <h1 class="greeting-title">What can I help you with?</h1>
        </div>

        <div class="messages-feed" id="messagesFeed"></div>
      </div>

      <!-- Floating Bottom Input Area -->
      <div class="input-container">
        <form class="input-pill" id="chatForm">
          <button type="button" class="action-icon-btn attachment-btn" title="Attachment" id="attachmentBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>

          <textarea
            id="messageInput"
            class="chat-textarea"
            rows="1"
            placeholder="Send a message..."
            autocomplete="off"
            spellcheck="false"
          ></textarea>

          <button type="submit" class="send-btn" id="sendBtn" disabled title="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </form>
        <div class="input-disclaimer">
          Gravix AI can make mistakes. Verify critical information.
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
